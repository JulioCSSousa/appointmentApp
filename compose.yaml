services:
  mysql:
    image: mysql:8
    container_name: mysql
    env_file:
      - .env 
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: passowrd  # Definindo senha para o root
      MYSQL_USER: mysql-3c187995-menudigitaldb.k.aivencloud.com
      MYSQL_DATABASE: dbappointment
      MYSQL_PASSWORD: AVNS_lGDbfDKbbczU5UPtRpC
    ports:
      - "3304:3306"  # MySQL disponível na porta 3304 fora do container
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: my-dotnet-app
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql  # Dentro do container, MySQL responde por "mysql"
      DB_PORT: 13331   # Dentro do container, use a porta interna do MySQL
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB}  # Nome do banco
    ports:
      - "13331:13331"  # Porta da aplicação .NET
volumes:
  mysql_data:
