services:
  appointment-mvc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=db                 
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=4306
      - DB=appointmentappdb
      - ASPNETCORE_URLS=http://+:8081
    depends_on:
      - db

  db:
    image: mysql:8.0.37
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "4306"   
      MYSQL_DATABASE: appointmentappdb
    ports:
      - "33061:3306"                
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: